name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out proofable/mcp for skill parity
        uses: actions/checkout@v7
        with:
          repository: proofable/mcp
          path: mcp
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Published skills match proofable/mcp canonical skills
        run: node scripts/check-mcp-skill-parity.mjs
        env:
          PROOFABLE_MCP_SKILLS_ROOT: ${{ github.workspace }}/mcp/skills
      - run: npm ci
      - run: npm run lint
      - run: npm test --silent
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run

