name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'proofable/sdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag
        run: node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('tag must equal v'+p.version)"
      - run: npm ci
      - run: npm run lint
      - run: npm test --silent
      - run: npm audit --omit=dev --audit-level=high
      # prepack (triggered by pack) is the single artifact build; publish skips lifecycle scripts.
      - run: npm pack --dry-run
      - name: Publish @proofable/sdk
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$name@$version is already published; skipping npm publish."
          else
            # Lifecycle scripts are skipped: lint/test/build already ran above (single execution).
            # Artifacts were built by the explicit build step and are packed as-is.
            npm publish --ignore-scripts --access public --registry https://registry.npmjs.org
          fi

